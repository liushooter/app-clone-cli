name: macos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n build.sh
      - name: Build and test
        run: make test
      - name: Build release
        run: make release
      - name: Check standalone binary
        run: |
          ./build/app-clone --version --json
          ./build/app-clone help --lang en
          ./build/app-clone help --lang zh
          git diff --exit-code
